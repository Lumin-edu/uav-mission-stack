# Hardware EGO multi-waypoint route.
#
# Coordinates are in the user task frame:
#   x = aircraft right, y = aircraft forward, z = up.
# The runner converts every point to the Point-LIO/EGO ROS FLU frame:
#   ros_x = task_y, ros_y = -task_x, ros_z = task_z.
# z is relative to the captured Point-LIO/PX4 takeoff origin, as in the
# single-goal hardware bringup. Edit this file after checking the real flight
# area and obstacle clearance.
frame_id: odom
coordinate_system: task_right_forward_up
waypoints:
  - {x: 0.0, y: 1.5, z: 0.8, yaw: 0.0}
  - {x: 1.0, y: 1.5, z: 0.8, yaw: 0.0}
  - {x: 1.0, y: 3.0, z: 0.8, yaw: 0.0}
  - {x: -1.0, y: 3.0, z: 0.8, yaw: 0.0}
