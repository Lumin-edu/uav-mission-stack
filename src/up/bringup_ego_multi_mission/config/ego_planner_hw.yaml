/**:
  ros__parameters:
    # ========== FSM（有限状态机）参数 ==========
    "fsm/flight_type": 1                   # 飞行类型：1=手动目标，由外部发布 goal 触发
    "fsm/thresh_replan_time": 1.0          # 两轮重规划的最小间隔 (s)
    "fsm/thresh_no_replan_meter": 1.0      # 目标位移小于此值时不重规划 (m)
    "fsm/planning_horizon": 6.0            # 规划视界距离 (m)
    "fsm/planning_horizen_time": 3.0       # 规划视界时间 (s)
    "fsm/emergency_time": 1.0              # 紧急停障时间 (s)
    "fsm/realworld_experiment": true        # 实物实验模式（禁用仿真逻辑）
    "fsm/fail_safe": true                   # 失效安全（急停）
    "fsm/manual_goal_z": 0.5               # 手动目标默认 z 高度 (m)
    "fsm/waypoint_num": 1                  # 航点数量
    "fsm/waypoint0_x": 1.0                 # 默认航点 x (m)
    "fsm/waypoint0_y": 0.0                 # 默认航点 y (m)
    "fsm/waypoint0_z": 0.5                 # 默认航点 z (m)

    # ========== Grid Map（栅格地图）参数 ==========
    "grid_map/resolution": 0.15             # 地图分辨率 (m)
    "grid_map/map_size_x": 8.0            # 地图大小 x (m)
    "grid_map/map_size_y": 8.0            # 地图大小 y (m)
    "grid_map/map_size_z": 3.0             # 地图大小 z (m)
    "grid_map/local_update_range_x": 4.0   # 局部更新范围 x (m)
    "grid_map/local_update_range_y": 4.0   # 局部更新范围 y (m)
    "grid_map/local_update_range_z": 3.0   # 局部更新范围 z (m)
    # 0.275m 无人机半径 + 0.125m 初始水平安全边距 = 0.40m 膨胀
    "grid_map/obstacles_inflation": 0.40   # 障碍物膨胀半径 (m)
    "grid_map/local_map_margin": 10        # 局部地图边界余量
    "grid_map/ground_height": -0.03        # 地面高度 (m)
    "grid_map/use_depth_filter": false     # 是否使用深度滤波
    "grid_map/depth_filter_tolerance": 0.15
    "grid_map/depth_filter_maxdist": 8.0
    "grid_map/depth_filter_mindist": 0.2
    "grid_map/depth_filter_margin": 2
    "grid_map/k_depth_scaling_factor": 1000.0
    "grid_map/skip_pixel": 2               # 跳点数（降采样）
    "grid_map/p_hit": 0.65                 # 击中概率
    "grid_map/p_miss": 0.35                # 丢失概率
    "grid_map/p_min": 0.12                 # 最小占用概率
    "grid_map/p_max": 0.90                 # 最大占用概率
    "grid_map/p_occ": 0.80                 # 占用判定阈值
    "grid_map/min_ray_length": 0.1
    "grid_map/max_ray_length": 8.0
    "grid_map/virtual_ceil_height": 1.5    # 虚拟天花板高度 (m)
    "grid_map/virtual_ceil_yp": 14.0
    "grid_map/virtual_ceil_yn": -14.0
    "grid_map/visualization_truncate_height": 2.5
    "grid_map/show_occ_time": false
    "grid_map/pose_type": 1
    "grid_map/frame_id": odom              # 参考坐标系

    # ========== 轨迹优化参数 ==========
    "manager/max_vel": 0.3                 # 最大速度 (m/s)
    "manager/max_acc": 0.5                 # 最大加速度 (m/s²)
    "manager/max_jerk": 1.0                # 最大加加速度 (m/s³)
    "manager/control_points_distance": 0.4 # 控制点间距 (m)
    "manager/feasibility_tolerance": 0.05  # 可行性容差
    "manager/planning_horizon": 6.0        # 规划视界 (m)
    "manager/use_distinctive_trajs": true  # 使用差异化轨迹
    "manager/drone_id": -1

    "optimization/lambda_smooth": 1.0      # 平滑代价权重
    "optimization/lambda_collision": 0.5   # 碰撞代价权重
    "optimization/lambda_feasibility": 0.1 # 可行性代价权重
    "optimization/lambda_fitness": 1.0     # 适应度代价权重
    "optimization/dist0": 0.5              # 安全距离 (m)
    "optimization/swarm_clearance": 0.5    # 集群安全距离 (m)
    "optimization/max_vel": 0.3            # 优化最大速度 (m/s)
    "optimization/max_acc": 0.5            # 优化最大加速度 (m/s²)

    "bspline/limit_vel": 0.3               # B样条速度限制 (m/s)
    "bspline/limit_acc": 0.5               # B样条加速度限制 (m/s²)
    "bspline/limit_ratio": 1.1             # B样条伸缩比例

    "prediction/obj_num": 0                # 动态障碍物预测数量（单机=0）
    "prediction/lambda": 1.0
    "prediction/predict_rate": 1.0
