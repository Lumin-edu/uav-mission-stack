  - {target_x: 1.0,  target_y: 0.0,  target_z: 0.40, target_yaw: 0.0}
  - {target_x: 1.0,  target_y: 1.0,  target_z: 0.40, target_yaw: 0.0}
  - {target_x: 0.0,  target_y: 1.0,  target_z: 0.40, target_yaw: 0.0}
  - {target_x: -1.0, target_y: 1.0,  target_z: 0.40, target_yaw: 0.0}
  - {target_x: -1.0, target_y: 0.0,  target_z: 0.40, target_yaw: 0.0}
  - {target_x: -1.0, target_y: -1.0, target_z: 0.40, target_yaw: 0.0}
  - {target_x: 0.0,  target_y: -1.0, target_z: 0.00, target_yaw: 0.0}
